<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MTG Enhance — Proof of Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="theme-color" content="#10140f" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<main id="app">

  <!-- HOME: host or join -->
  <section id="screen-home" class="screen">
    <div class="top-bar">
      <button id="btn-login" class="btn-ghost" type="button">Log in</button>
    </div>

    <h1 class="wordmark">MTG Enhance</h1>
    <p class="tagline">Life totals and a soundboard for the table.</p>

    <div id="rejoin-banner" class="rejoin-banner" hidden>
      <div>
        <p class="rejoin-title">You were in game <span id="rejoin-code"></span></p>
        <p class="rejoin-sub">Your life total, commander and turn are still there.</p>
      </div>
      <div class="rejoin-actions">
        <button id="btn-rejoin" class="btn btn-primary" type="button">Rejoin</button>
        <button id="btn-forget-game" class="btn-ghost" type="button">Dismiss</button>
      </div>
    </div>

    <div class="stack">
      <label class="pin-toggle">
        <input id="input-pin-required" type="checkbox" />
        <span>Require a PIN to join</span>
      </label>
      <input id="input-host-pin" class="code-input pin-input" type="text" inputmode="numeric"
             maxlength="4" placeholder="PIN" autocomplete="off" hidden />

      <button id="btn-host-local" class="btn btn-primary btn-mode" data-mode="colocated">
        <span class="btn-mode-title">Host a local game</span>
        <span class="btn-mode-sub">Everyone's at one table — music and board wipes play on your device only</span>
      </button>

      <button id="btn-host-remote" class="btn btn-secondary btn-mode" data-mode="remote">
        <span class="btn-mode-title">Host a remote game</span>
        <span class="btn-mode-sub">Everyone's on their own screen — music and board wipes play for all players</span>
      </button>

      <div class="divider">or</div>

      <form id="form-join" class="join-form">
        <input
          id="input-code"
          class="code-input"
          type="text"
          inputmode="text"
          maxlength="4"
          placeholder="CODE"
          autocomplete="off"
          autocapitalize="characters"
        />
        <button type="submit" class="btn btn-secondary">Join a game</button>
      </form>
    </div>

    <p id="home-error" class="error" hidden></p>

    <section class="favorites">
      <h2 class="section-heading">Favorites</h2>
      <div id="favorites-list"></div>
    </section>
  </section>

  <!-- LOBBY: pick a name, commander, colors -->
  <section id="screen-lobby" class="screen" hidden>
    <p class="eyebrow-code">Table code</p>
    <p id="lobby-code" class="join-code"></p>

    <form id="form-lobby" class="lobby-form">
      <label class="field" id="join-pin-field" hidden>
        <span>Table PIN</span>
        <input id="input-join-pin" type="text" inputmode="numeric" maxlength="4" autocomplete="off" />
      </label>

      <label class="field">
        <span>Your name</span>
        <input id="input-name" type="text" maxlength="20" required autocomplete="off" />
      </label>

      <div class="field">
        <label for="input-commander">Commander</label>
        <div class="combobox">
          <input
            id="input-commander"
            type="text"
            maxlength="40"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            placeholder="e.g. Atraxa, Grand Unifier"
            role="combobox"
            aria-expanded="false"
            aria-autocomplete="list"
            aria-controls="commander-suggestions"
          />
          <ul id="commander-suggestions" class="suggestions" role="listbox" hidden></ul>
        </div>
        <p id="commander-note" class="field-note" hidden></p>
        <button id="btn-fav-commander" class="btn-ghost btn-ghost-sm fav-btn" type="button" hidden></button>
      </div>

      <fieldset class="field colors-field">
        <legend>Color identity</legend>
        <div class="color-toggles">
          <label class="color-toggle color-w"><input type="checkbox" value="W" /><span>W</span></label>
          <label class="color-toggle color-u"><input type="checkbox" value="U" /><span>U</span></label>
          <label class="color-toggle color-b"><input type="checkbox" value="B" /><span>B</span></label>
          <label class="color-toggle color-r"><input type="checkbox" value="R" /><span>R</span></label>
          <label class="color-toggle color-g"><input type="checkbox" value="G" /><span>G</span></label>
          <label class="color-toggle color-c" title="Colorless"><input type="checkbox" value="C" /><span>C</span></label>
        </div>
        <p id="identity-warning" class="field-note error" role="status" hidden></p>
      </fieldset>

      <p id="lobby-error" class="field-note error" hidden></p>
      <button type="submit" class="btn btn-primary">Sit down at the table</button>
    </form>
  </section>

  <!-- GAME: life totals + soundboard -->
  <section id="screen-game" class="screen" hidden>
    <header class="game-header">
      <div class="code-box">
        <span class="code-label" id="code-label">Game code</span>
        <span class="join-code-small" id="game-code"></span>
      </div>
      <button id="btn-turn-order" class="btn-ghost btn-ghost-sm" type="button" hidden>Turn order</button>
      <div class="header-actions">
        <span id="conn-status" class="conn-status" role="status" hidden></span>
        <button id="btn-mute" class="header-icon" type="button" aria-pressed="false" aria-label="Mute all sounds"></button>
        <button id="btn-oracle" class="header-icon" type="button" aria-label="Ask the Oracle a rules question">
          <span class="oracle-glyph">O</span>
        </button>
        <button id="btn-help" class="header-icon" type="button" aria-label="How this works">?</button>
      </div>
    </header>

    <div class="self-panel" id="self-panel">
      <p class="player-name" id="self-name"></p>
      <p class="self-commander" id="self-commander" hidden></p>
      <div class="life-row">
        <button class="life-btn life-btn-big" data-delta="-5">−5</button>
        <button class="life-btn" data-delta="-1">−1</button>
        <span class="life-total" id="self-life">40</span>
        <button class="life-btn" data-delta="1">+1</button>
        <button class="life-btn life-btn-big" data-delta="5">+5</button>
      </div>
      <div class="self-actions">
        <div id="counter-chips" class="counter-chips"></div>
        <button id="btn-pass-turn" class="btn pass-turn-btn" type="button" hidden>Pass turn</button>
      </div>
    </div>

    <div id="opponents" class="opponents"></div>

    <div id="soundboard" class="soundboard"></div>

    <div class="life-event-panel">
      <div class="life-event-columns">
        <div class="toggle-col" id="target-toggle-group"></div>
        <div class="toggle-col" id="player-toggle-group"></div>
        <div class="toggle-col" id="kind-toggle-group">
          <button type="button" class="toggle-btn" data-value="gain">Gains Life</button>
          <button type="button" class="toggle-btn" data-value="loss">Loses Life</button>
          <button type="button" class="toggle-btn active" data-value="damage">Takes Damage</button>
        </div>
        <div class="wheel-col">
          <div class="number-wheel" id="wheel-amount"></div>
        </div>
        <button id="btn-apply-life-event" class="send-btn" type="button" aria-label="Send">
          <span aria-hidden="true">S</span><span aria-hidden="true">E</span><span aria-hidden="true">N</span><span aria-hidden="true">D</span>
        </button>
      </div>
    </div>
  </section>

</main>

<div id="modal-backdrop" class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 id="modal-title" class="modal-title"></h2>
      <button id="modal-close" class="modal-close" type="button" aria-label="Close">&times;</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<script src="/client.js"></script>
</body>
</html>
